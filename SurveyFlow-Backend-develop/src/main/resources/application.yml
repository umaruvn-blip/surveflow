spring:
  config:
    import: optional:file:.dev.env[.properties]
  application:
    name: ${APP_NAME:survey-flow}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:local-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:local-google-client-secret}
            scope: openid,profile,email
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://openidconnect.googleapis.com/v1/userinfo
            jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs
            user-name-attribute: sub
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    locations: ${SPRING_FLYWAY_LOCATIONS:classpath:db/migration}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:validate}
    open-in-view: ${SPRING_JPA_OPEN_IN_VIEW:false}

server:
  port: ${PORT:${SERVER_PORT:8080}}
  address: 0.0.0.0
  forward-headers-strategy: framework
  servlet:
    context-path: ${SERVER_CONTEXT_PATH:/}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_API_DOCS_ENABLED:true}
    path: ${SPRINGDOC_API_DOCS_PATH:/v3/api-docs}
  swagger-ui:
    enabled: ${SPRINGDOC_SWAGGER_UI_ENABLED:true}
    path: ${SPRINGDOC_SWAGGER_UI_PATH:/swagger-ui.html}
    operations-sorter: ${SPRINGDOC_SWAGGER_UI_SORTER:alpha}

app:
  swagger:
    title: ${APP_SWAGGER_TITLE:Survey Flow API}
    version: ${APP_SWAGGER_VERSION:v1}
    description: ${APP_SWAGGER_DESCRIPTION:Backend API for Survey Flow}
    contact-name: ${APP_SWAGGER_CONTACT_NAME:Survey Flow Team}
    contact-email: ${APP_SWAGGER_CONTACT_EMAIL:support@surveyflow.com}
  cors:
    allowed-origins: ${FRONTEND_BASE_URL:http://localhost:5173}
    allowed-methods: ${APP_CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
    allowed-headers: ${APP_CORS_ALLOWED_HEADERS:*}
    exposed-headers: ${APP_CORS_EXPOSED_HEADERS:Authorization,Content-Disposition}
    allow-credentials: ${APP_CORS_ALLOW_CREDENTIALS:true}
    max-age: ${APP_CORS_MAX_AGE:3600}
  jwt:
    access-token-secret: ${APP_JWT_ACCESS_TOKEN_SECRET:VGhpc0lzQVRlbXBsYXRlQWNjZXNzVG9rZW5TZWNyZXRLZXlTaG91bGRCZUF0TGVhc3QzMkJ5dGVz}
    refresh-token-secret: ${APP_JWT_REFRESH_TOKEN_SECRET:VGhpc0lzQVRlbXBsYXRlUmVmcmVzaFRva2VuU2VjcmV0S2V5U2hvdWxkQmVBdExlYXN0MzJCeXRlcw==}
    access-token-expiration-ms: ${APP_JWT_ACCESS_TOKEN_EXPIRATION_MS:900000}
    refresh-token-expiration-ms: ${APP_JWT_REFRESH_TOKEN_EXPIRATION_MS:604800000}
    refresh-token-cookie-name: ${APP_JWT_REFRESH_TOKEN_COOKIE_NAME:refreshToken}
    refresh-token-cookie-secure: ${APP_JWT_REFRESH_TOKEN_COOKIE_SECURE:false}
    refresh-token-cookie-same-site: ${APP_JWT_REFRESH_TOKEN_COOKIE_SAME_SITE:Strict}
  oauth2:
    frontend-callback-url: ${GOOGLE_FRONTEND_CALLBACK_URL:http://localhost:5173/auth/callback}
  ai-matching:
    service-url: ${AI_MATCHING_SERVICE_URL:http://localhost:8000}
    default-top-k: ${AI_MATCHING_DEFAULT_TOP_K:10}
    timeout-ms: ${AI_MATCHING_TIMEOUT_MS:5000}

logging:
  level:
    root: ${LOGGING_LEVEL_ROOT:INFO}
    com.surveyflow: ${LOGGING_LEVEL_APP:DEBUG}
